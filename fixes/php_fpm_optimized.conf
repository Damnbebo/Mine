; PHP-FPM Pool Optimization for /etc/php/8.3/fpm/pool.d/www.conf
; These settings optimize PHP-FPM for better performance

[www]
user = www-data
group = www-data

listen = /var/run/php/php8.3-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Process Management - Use 'ondemand' to save memory when idle
pm = ondemand
pm.max_children = 50
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.process_idle_timeout = 10s
pm.max_requests = 500

; For SSE streams - allow long-running requests
request_terminate_timeout = 300s

; Slow log for debugging
slowlog = /var/log/php8.3-fpm.slow.log
request_slowlog_timeout = 10s

; Clear environment for security
clear_env = no

; Status page for monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Limit memory per process
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
